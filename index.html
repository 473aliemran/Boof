<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>BOOF</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}body{background:#111;color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;padding:18px 16px 90px;background:radial-gradient(circle at 50% 20%,#262626 0,#111 45%)}button{font:inherit;border:0;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:1000;letter-spacing:3px}.hello{font-size:12px;color:#999;margin-top:4px}.level{background:#292929;border:1px solid #3d3d3d;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stats div{background:#1b1b1b;border:1px solid #292929;border-radius:15px;padding:11px;text-align:center}.stats span{display:block;font-size:18px}.stats b{display:block;font-size:16px;margin-top:3px}.stats small{display:block;color:#777;font-size:8px;margin-top:3px}.coin-zone{position:relative;text-align:center;padding:28px 0 18px}.boof{position:relative;width:230px;height:230px;border-radius:50%;background:linear-gradient(145deg,#f5f5f5,#aaa);box-shadow:0 18px 50px #000,inset 0 4px 8px #fff;transition:.08s;touch-action:manipulation}.boof:active{transform:scale(.94)}.boof:before{content:"";position:absolute;inset:18px;border-radius:50%;background:linear-gradient(145deg,#222,#555);box-shadow:inset 0 8px 20px #000}.eyes{position:absolute;top:82px;left:65px;right:65px;display:flex;justify-content:space-between;z-index:2}.eyes i{width:20px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 -5px #bbb}.beak{position:absolute;z-index:3;top:116px;left:96px;width:38px;height:27px;background:#777;clip-path:polygon(0 0,100% 50%,0 100%)}.wings{position:absolute;z-index:2;width:50px;height:90px;background:#777;top:80px}.wings.left{left:22px;border-radius:70% 20% 20% 70%;transform:rotate(10deg)}.wings.right{right:22px;border-radius:20% 70% 70% 20%;transform:rotate(-10deg)}.coin-zone p{color:#888;font-size:12px}.fx{position:fixed;z-index:20;pointer-events:none;font-weight:900;font-size:22px;animation:float .5s ease-out forwards}@keyframes float{to{transform:translateY(-70px);opacity:0}}.energy{margin-top:4px}.energy-row{display:flex;justify-content:space-between;font-size:12px;color:#bbb}.energy-row span{color:#777}.bar{height:8px;background:#252525;border-radius:10px;overflow:hidden;margin-top:7px}.bar div{height:100%;background:#fff;border-radius:10px}.cards{display:grid;gap:9px;margin-top:16px}.card{background:#1b1b1b;border:1px solid #2b2b2b;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:space-between}.card div{display:grid;grid-template-columns:35px 1fr}.card span{grid-row:span 2;font-size:22px}.card strong{font-size:13px}.card small{font-size:10px;color:#777;margin-top:4px}.card button,.primary{background:#fff;color:#111;border-radius:11px;padding:9px 12px;font-weight:bold;font-size:11px}.card button:disabled{opacity:.3}.page{padding-top:25px}.page h2{font-size:22px}.task,.leader{background:#1b1b1b;border:1px solid #292929;border-radius:15px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:12px}.task span{font-size:24px}.task div{flex:1}.task b,.task small{display:block}.task small{font-size:10px;color:#777;margin-top:4px}.task strong{font-size:11px}.center{text-align:center}.big-icon{font-size:60px;margin-top:35px}.page p{color:#888;font-size:13px}.invite{direction:ltr;background:#191919;border:1px dashed #444;border-radius:12px;padding:12px;font-size:10px;margin:20px 0;overflow:hidden}.primary{padding:12px 25px}.counter{margin-top:25px;color:#aaa}.leader b{width:35px;color:#888}.leader span{flex:1}.leader strong{font-size:11px}.leader.me{border-color:#777}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#171717ee;backdrop-filter:blur(10px);border-top:1px solid #292929;padding:9px 8px max(9px,env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:#777;font-size:18px;padding:3px}nav button.active{color:#fff}nav small{display:block;font-size:9px;margin-top:3px}

</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><div class="brand">BOOF</div><div class="hello" id="hello">سلام، BOOF Player 👋</div></div>
  <div class="level" id="level">LVL 1</div>
</header>

<div id="content"></div>

<nav>
<button data-tab="home">🏠<small>خانه</small></button>
<button data-tab="tasks">🎁<small>پاداش</small></button>
<button data-tab="friends">👥<small>دوستان</small></button>
<button data-tab="leaders">🏆<small>رتبه‌ها</small></button>
</nav>
</main>
<script>
const tg = window.Telegram?.WebApp;
const STORAGE = "boof-static-v2";
const defaults = {coins:0,energy:500,maxEnergy:500,power:1,level:1,incomePerHour:0,lastTick:Date.now(),invited:0,dailyStreak:0,dailyClaimedAt:0};
let game = {...defaults, ...(JSON.parse(localStorage.getItem(STORAGE)||"null")||{})};
let tab = "home";

function save(){ localStorage.setItem(STORAGE, JSON.stringify(game)); }
function username(){ return tg?.initDataUnsafe?.user?.first_name || "BOOF Player"; }
function money(n){ return Math.floor(n).toLocaleString("en-US"); }
function upgradeCost(){ return Math.floor(50*Math.pow(1.65,game.level-1)); }

function render(){
  document.getElementById("hello").textContent = "سلام، "+username()+" 👋";
  document.getElementById("level").textContent = "LVL "+game.level;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const c=document.getElementById("content");

  if(tab==="home"){
    const pct=Math.min(100,game.energy/game.maxEnergy*100);
    c.innerHTML=`
    <section class="stats">
      <div><span>🪙</span><b>${money(game.coins)}</b><small>COINS</small></div>
      <div><span>⚡</span><b>${Math.floor(game.energy)}</b><small>ENERGY</small></div>
      <div><span>🚀</span><b>+${game.incomePerHour}</b><small>/ HOUR</small></div>
    </section>
    <section class="coin-zone">
      <div class="coin-glow"></div>
      <button class="boof" id="tap" aria-label="Tap BOOF"><div class="eyes"><i></i><i></i></div><div class="beak"></div><div class="wings left"></div><div class="wings right"></div></button>
      <p>برای دریافت سکه روی BOOF بزن</p>
    </section>
    <section class="energy"><div class="energy-row"><b>⚡ ${Math.floor(game.energy)} / ${game.maxEnergy}</b><span>+2/sec</span></div><div class="bar"><div style="width:${pct}%"></div></div></section>
    <section class="cards">
      <div class="card"><div><span>🆙</span><strong>قدرت کلیک</strong><small>هر کلیک +${game.power} سکه</small></div><button id="upgrade" ${game.coins<upgradeCost()?"disabled":""}>🪙 ${money(upgradeCost())}</button></div>
      <div class="card"><div><span>🤖</span><strong>درآمد خودکار</strong><small>سکه در ساعت</small></div><button id="auto" ${game.coins<500?"disabled":""}>🪙 500</button></div>
    </section>`;
    document.getElementById("tap").onclick=()=>{
      if(game.energy<game.power)return;
      game.coins+=game.power; game.energy=Math.max(0,game.energy-game.power); save(); render();
      tg?.HapticFeedback?.impactOccurred?.("light");
    };
    document.getElementById("upgrade").onclick=()=>{
      const cost=upgradeCost(); if(game.coins<cost)return;
      game.coins-=cost; game.power++; game.level++; game.maxEnergy+=25; save(); render();
      tg?.HapticFeedback?.impactOccurred?.("medium");
    };
    document.getElementById("auto").onclick=()=>{
      if(game.coins<500)return; game.coins-=500; game.incomePerHour+=100; save(); render();
    };
  }
  if(tab==="tasks"){
    const today=new Date().toDateString();
    const claimed=new Date(game.dailyClaimedAt).toDateString()===today;
    const reward=250+game.dailyStreak*100;
    c.innerHTML=`<section class="page"><h2>🎁 پاداش‌ها</h2>
      <div class="task" id="daily"><span>📅</span><div><b>Daily Reward</b><small>${claimed?"امروز دریافت شده":"امروز جایزه‌ات را بگیر"}</small></div><strong>${claimed?"DONE":"+"+money(reward)}</strong></div>
      <div class="task"><span>👥</span><div><b>Invite Friends</b><small>دوست دعوت کن و جایزه بگیر</small></div><strong>+1,000</strong></div>
      <div class="task"><span>⭐</span><div><b>Coming Soon</b><small>ماموریت‌های بیشتر به‌زودی</small></div><strong>LOCK</strong></div>
    </section>`;
    document.getElementById("daily").onclick=()=>{
      if(claimed)return;
      game.coins+=reward; game.dailyStreak++; game.dailyClaimedAt=Date.now(); save(); render();
      tg?.HapticFeedback?.notificationOccurred?.("success");
    };
  }
  if(tab==="friends"){
    const link="https://t.me/BOOF_Bot?start=ref_demo";
    c.innerHTML=`<section class="page center"><div class="big-icon">👥</div><h2>دوستاتو دعوت کن</h2><p>برای هر دوست جدید، جایزه دریافت کن.</p><div class="invite">${link}</div><button class="primary" id="copy">کپی لینک دعوت</button><div class="counter">دعوت‌شده‌ها: ${game.invited}</div></section>`;
    document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(link)}catch{}};
  }
  if(tab==="leaders"){
    const list=[["BOOF KING",98420],["CryptoFox",77110],["Mina",65200],[username(),Math.floor(game.coins)]].sort((a,b)=>b[1]-a[1]);
    c.innerHTML=`<section class="page"><h2>🏆 رتبه‌بندی</h2>${list.map((x,i)=>`<div class="leader ${x[0]===username()?"me":""}"><b>#${i+1}</b><span>${x[0]}</span><strong>🪙 ${money(x[1])}</strong></div>`).join("")}</section>`;
  }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
tg?.ready(); tg?.expand(); tg?.setHeaderColor?.("#111111"); tg?.setBackgroundColor?.("#111111");
setInterval(()=>{const now=Date.now();const sec=Math.min(5,(now-game.lastTick)/1000);game.energy=Math.min(game.maxEnergy,game.energy+sec*2);game.coins+=sec*(game.incomePerHour/3600);game.lastTick=now;save();if(tab==="home")render()},1000);
render();
</script>
</body>
</html>
